name: Audit external links

on:
  schedule:
    - cron: '23 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-links:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Build fresh shared layout HTML
        run: npm run build
      - name: Audit compiled MDX and exported layout links
        run: >-
          npm run content:check-links --
          --html-dir out --json external-links-report.json
      - name: Upload link audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: external-links-report
          path: external-links-report.json
          if-no-files-found: warn
          retention-days: 14
